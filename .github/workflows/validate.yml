name: Validate tap
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Architecture-independent checks. Intel-only verification happens on the
    # protected builder, not here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository schema, formulae, and shell syntax
        run: scripts/check-repository.sh
      - name: Test host diagnostic
        run: scripts/test-doctor.sh
      - name: Test that the validator rejects what it claims to
        run: scripts/test-validator.sh
      - name: Stable-branch invariants
        # Candidates must never reach users by being merged to main.
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: scripts/check-stable-branch.sh
